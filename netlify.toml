# Netlify Configuration for KYC AI Assistant
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Diretório de publicação (onde está o index.html)
  publish = "."
  
  # Funções serverless na pasta netlify/functions
  functions = "netlify/functions"

# Headers de segurança e performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers para fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Redirects (opcional - para SPA se necessário)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

